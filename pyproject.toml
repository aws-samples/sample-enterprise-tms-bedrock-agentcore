[project]
name = "sample-enterprise-tms-bedrock-agentcore"
version = "0.1.0"
description = "Cost-optimized agentic TMS sample on Amazon Bedrock AgentCore with an AWS Step Functions backbone"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
    "cdk-nag>=2.28.0,<3.0.0",
    "boto3>=1.34.0",
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["cdk*", "lambdas*", "agents*", "shared*"]
